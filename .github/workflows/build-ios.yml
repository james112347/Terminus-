name: Build Terminus iOS

on:
  push:
    branches: [ main, 'claude/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications/ | grep Xcode

      - name: Select Xcode
        run: |
          # Use latest Xcode available on macos-15
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available | head -30

      - name: Build for iOS Simulator (verification)
        run: |
          xcodebuild build \
            -project Terminus.xcodeproj \
            -scheme Terminus \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tail -30

      - name: Archive for device (unsigned IPA)
        run: |
          xcodebuild archive \
            -project Terminus.xcodeproj \
            -scheme Terminus \
            -archivePath build/Terminus.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tail -30

      - name: Create IPA from archive
        run: |
          mkdir -p build/Payload
          cp -r build/Terminus.xcarchive/Products/Applications/Terminus.app build/Payload/
          cd build
          zip -r Terminus.ipa Payload/
          echo "IPA size:"
          ls -lh Terminus.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terminus-iOS
          path: build/Terminus.ipa
          retention-days: 90
