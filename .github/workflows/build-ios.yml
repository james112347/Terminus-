name: Build Terminus iOS

on:
  push:
    branches: [ main, 'claude/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build for device (unsigned)
        run: |
          xcodebuild build \
            -project Terminus.xcodeproj \
            -scheme Terminus \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Terminus.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Not at standard path, searching..."
            APP_PATH=$(find build -name "Terminus.app" -type d | head -1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Terminus.app not found. Build contents:"
            find build -name "*.app" -type d 2>/dev/null
            find build/DerivedData/Build/Products -type d -maxdepth 3 2>/dev/null
            exit 1
          fi
          echo "Found: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r Terminus.ipa Payload/
          ls -lh Terminus.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Terminus-iOS
          path: build/Terminus.ipa
          retention-days: 90
