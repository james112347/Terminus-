name: Build Terminus iOS

on:
  push:
    branches: [ main, 'claude/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Build for device (unsigned)
        run: |
          xcodebuild build \
            -project Terminus.xcodeproj \
            -scheme Terminus \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee /tmp/xcodebuild.log
          echo "Build completed with exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: Show build errors
        if: failure()
        run: |
          echo "========== BUILD ERRORS =========="
          grep -A 2 "error:" /tmp/xcodebuild.log 2>/dev/null || true
          echo ""
          echo "========== LAST 100 LINES =========="
          tail -100 /tmp/xcodebuild.log 2>/dev/null || true

      - name: Package IPA
        run: |
          APP_PATH=$(find "$PWD/build" -name "Terminus.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Terminus.app not found"
            find "$PWD/build" -type d -maxdepth 5 2>/dev/null
            exit 1
          fi
          echo "Found: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r Terminus.ipa Payload/
          ls -lh Terminus.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Terminus-iOS
          path: build/Terminus.ipa
          retention-days: 90
