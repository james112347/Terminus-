name: Build Terminus iOS

on:
  push:
    branches: [ main, 'claude/*' ]
    paths:
      - 'Terminus/**'
      - 'Terminus.xcodeproj/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project Terminus.xcodeproj \
            -scheme Terminus \
            -sdk iphonesimulator \
            -arch arm64 \
            -configuration Release \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee /tmp/xcodebuild.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT"
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "BUILD FAILED"
            exit $BUILD_EXIT
          fi

      - name: Show build errors
        if: failure()
        run: |
          echo "========== BUILD ERRORS =========="
          grep -A 2 "error:" /tmp/xcodebuild.log 2>/dev/null || true
          echo ""
          echo "========== WARNINGS =========="
          grep -c "warning:" /tmp/xcodebuild.log 2>/dev/null || true
          echo ""
          echo "========== LAST 80 LINES =========="
          tail -80 /tmp/xcodebuild.log 2>/dev/null || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/xcodebuild.log
          retention-days: 7

      - name: Verify build output
        run: |
          echo "=== Searching for .app ==="
          APP_PATH=$(find "$PWD/build" -name "Terminus.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Found: $APP_PATH"
            du -sh "$APP_PATH"
          else
            echo "Build product in DerivedData (simulator build)"
          fi
          echo "Build completed successfully."
