name: Build Terminus iOS

on:
  push:
    branches: [ main, 'claude/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build for device (unsigned)
        run: |
          xcodebuild build \
            -project Terminus.xcodeproj \
            -scheme Terminus \
            -sdk iphoneos \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=$PWD/build/Release-iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          ls -la build/Release-iphoneos/
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/Terminus.app build/Payload/
          cd build
          zip -r Terminus.ipa Payload/
          ls -lh Terminus.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Terminus-iOS
          path: build/Terminus.ipa
          retention-days: 90
