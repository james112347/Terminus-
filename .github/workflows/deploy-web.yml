name: Deploy Web App

on:
  push:
    branches: [ main, 'claude/*' ]
    paths: [ 'web/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Web Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          echo "Checking web/ structure..."
          test -f web/index.html || { echo "ERROR: web/index.html missing"; exit 1; }
          test -f web/manifest.json || { echo "ERROR: web/manifest.json missing"; exit 1; }
          test -f web/sw.js || { echo "ERROR: web/sw.js missing"; exit 1; }
          test -d web/js || { echo "ERROR: web/js/ missing"; exit 1; }
          test -d web/css || { echo "ERROR: web/css/ missing"; exit 1; }
          echo "All required files present."

      - name: Check JS syntax
        run: |
          echo "Checking JS files for syntax errors..."
          ERRORS=0
          for f in $(find web/js -name '*.js'); do
            # Copy as .mjs so Node parses ES module syntax (import/export)
            cp "$f" /tmp/_syntax_check.mjs
            if ! node --check /tmp/_syntax_check.mjs 2>&1; then
              echo "SYNTAX ERROR: $f"
              ERRORS=$((ERRORS+1))
            fi
          done
          rm -f /tmp/_syntax_check.mjs
          if [ $ERRORS -gt 0 ]; then
            echo "$ERRORS file(s) with syntax errors"
            exit 1
          fi
          echo "All JS files pass syntax check."

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
