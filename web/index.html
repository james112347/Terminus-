<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Terminus">
<meta name="theme-color" content="#f4f4fa">
<meta name="description" content="Terminus - Wellness Intelligence Platform. Traccia energia, sonno, caffeina e ottimizza la tua produttività con IA.">
<title>Terminus - Wellness Intelligence</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236c5ce7'/><text x='50' y='68' text-anchor='middle' fill='white' font-size='50' font-family='system-ui'>T</text></svg>">
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-inner">
    <div class="header-logo">T</div>
    <h1>Dashboard</h1>
  </div>
</div>

<!-- Main Content Area -->
<div class="main" id="app-content">
  <div class="loading-view">
    <div class="loading-dots">Caricamento Terminus</div>
  </div>
</div>

<!-- Tab Bar -->
<nav class="tabbar">
  <button class="tab active" data-view="dashboard">
    <span class="tab-icon">⚡</span>
    Energia
  </button>
  <button class="tab" data-view="timeline">
    <span class="tab-icon">📋</span>
    Timeline
  </button>
  <button class="tab" data-view="coaching">
    <span class="tab-icon">🤖</span>
    Coach
  </button>
  <button class="tab" data-view="reports">
    <span class="tab-icon">📊</span>
    Report
  </button>
  <button class="tab" data-view="profile">
    <span class="tab-icon">👤</span>
    Profilo
  </button>
  <button class="tab" data-view="settings">
    <span class="tab-icon">⚙️</span>
    Config
  </button>
</nav>

<!-- App Entry Point -->
<script type="module" src="js/app.js"></script>

</body>
</html>
